name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Prepare Build Environment
        run: |
          # Create .env from template if missing
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Decode debug keystore if stored in base64
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure Gradle wrapper exists and has executable permissions
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: color-sort-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
